<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOVA BREAK</title>
<style>
:root{--bg:#07090d;--panel:#0b1018;--line:#263443;--cyan:#8be9fd;--red:#ff263b;--muted:#728092;--white:#e8f1f7}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--white);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
body{position:relative}
#secret{position:absolute;top:0;left:0;width:1px;height:1px;opacity:.01;border:0;padding:0;z-index:20}
#app{height:100dvh;width:100vw;display:flex;flex-direction:column;background:radial-gradient(ellipse at center,#101722 0%,#07090d 72%);transition:background .5s}
#timer-zone{height:33.3333%;min-height:0;flex:0 0 33.3333%;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid var(--line);padding:1vh 2vw}
#timer{display:flex;align-items:center;justify-content:center;gap:.08em;font-size:min(24vw,25vh,30rem);height:.95em;color:var(--red);filter:drop-shadow(0 0 5px #ff263b88)}
.digit{position:relative;display:inline-block;width:.55em;height:1em;flex:0 0 .55em}
.seg{position:absolute;display:block;background:#351116;opacity:.55;border-radius:0.025em}
.seg.on{background:var(--red);opacity:1;filter:drop-shadow(0 0 .025em #ff263b)}
.seg.a,.seg.g,.seg.d{left:18%;width:64%;height:8%;clip-path:polygon(10% 0,90% 0,100% 50%,90% 100%,10% 100%,0 50%)}
.seg.a{top:2%}.seg.g{top:46%}.seg.d{bottom:2%}
.seg.f,.seg.b,.seg.e,.seg.c{width:10%;height:39%;clip-path:polygon(0 8%,50% 0,100% 8%,100% 92%,50% 100%,0 92%)}
.seg.f{left:7%;top:6%}.seg.b{right:7%;top:6%}.seg.e{left:7%;bottom:6%}.seg.c{right:7%;bottom:6%}
.timer-colon{display:flex;flex-direction:column;justify-content:space-evenly;height:.72em;width:.12em;flex:0 0 .12em;margin:0 .015em}
.timer-colon i{display:block;width:.12em;height:.12em;background:var(--red);filter:drop-shadow(0 0 .03em #ff263b)}
#game-zone{height:66.6667%;min-height:0;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:clamp(7px,1.5vh,18px) clamp(8px,2vw,24px) max(8px,env(safe-area-inset-bottom));gap:clamp(5px,1vh,12px);overflow:hidden}
#progress{display:flex;align-items:center;gap:14px;flex:0 0 auto;width:min(100%,1100px);font-size:clamp(11px,1.7vw,16px);color:var(--cyan);letter-spacing:.13em}
#bars{display:flex;gap:5px;flex:1}
.bar{height:4px;flex:1;background:#25313c}
.bar.active{background:var(--cyan);box-shadow:0 0 9px #8be9fd99}
#question-frame{width:min(100%,1100px);min-height:0;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;border:0;background:#000;position:relative}
#question-image{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
#pdf-placeholder{background:var(--panel);color:var(--muted);text-align:center;padding:24px;line-height:1.7;font-size:clamp(11px,1.8vw,15px);max-width:600px}
#answer-row{width:min(100%,1100px);display:flex;justify-content:center;align-items:center;gap:10px;flex:0 0 auto}
#answer{width:min(70%,400px);background:#090d13;color:var(--white);border:1px solid #425466;border-bottom:2px solid var(--cyan);border-radius:0;padding:10px 12px;font:600 clamp(16px,2.5vh,22px) ui-monospace,monospace;letter-spacing:.18em;text-align:center;outline:none;text-transform:lowercase}
#answer:focus{border-color:var(--cyan);box-shadow:0 0 0 2px #8be9fd22}
button{font:700 12px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--cyan);background:transparent;color:var(--cyan);padding:12px 16px;cursor:pointer}
button:active{background:#8be9fd22}
#hint{display:none}
#start-screen,#end-screen{position:absolute;inset:0;z-index:10;background:radial-gradient(ellipse at center,#111b27 0%,#07090d 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#start-screen h1,#start-screen p{display:none}
#start-screen .bottom-title{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));font-size:clamp(20px,4vw,34px);letter-spacing:.35em;color:var(--red);font-weight:800}
#start-btn{font-size:14px;padding:15px 30px}
#pdf-input{display:block;max-width:280px;width:100%;font-size:11px;color:var(--muted);margin-top:18px}
#end-screen{gap:22px}
#end-title{font-size:clamp(28px,7vw,64px);letter-spacing:.08em;margin:0}
#end-detail{display:none}
.hidden{display:none!important}
body.danger #app{animation:heartbeat 1.8s ease-in-out infinite;background:radial-gradient(ellipse at center,#250b10 0%,#13090c 55%,#07090d 100%)}
body.danger #timer{animation:timerpulse 1.8s ease-in-out infinite}
@keyframes heartbeat{0%,100%{background-color:#07090d;filter:none}14%{filter:brightness(1.08)}28%{filter:brightness(1.02)}42%{filter:brightness(1.06)}56%{filter:brightness(1)}}
@keyframes timerpulse{0%,100%{text-shadow:0 0 5px #ff263b,0 0 18px #ff263b66}18%{text-shadow:0 0 7px #ff263b,0 0 24px #ff263b88}40%{text-shadow:0 0 5px #ff263b,0 0 18px #ff263b66}}
@media(max-width:600px){#game-zone{padding-left:7px;padding-right:7px}#progress{gap:9px}button{padding:11px 12px}#answer{padding:9px 5px}}
</style>
</head>
<body>
<input id="secret" aria-label="secret reset command" autocomplete="off" spellcheck="false" tabindex="-1">
<div id="app">
  <section id="timer-zone">
    <div id="timer" aria-live="off"></div>
  </section>
  <section id="game-zone">
    <div id="progress"><span id="count">1/3</span><div id="bars"><i class="bar active"></i><i class="bar"></i><i class="bar"></i></div></div>
    <div id="question-frame">
      <div id="pdf-placeholder" class="hidden"></div>
      <img id="question-image" class="hidden" alt="Current quiz question">
    </div>
    <div id="answer-row"><input id="answer" type="text" placeholder="_____" aria-label="Answer" autocomplete="off" autocapitalize="none" spellcheck="false"><button id="submit">ENTER ↵</button></div>
    <div id="hint" aria-live="polite"></div>
  </section>
</div>
<div id="start-screen">
  <button id="start-btn">START</button>
  <div class="bottom-title">NOVA BREAK</div>
</div>
<div id="end-screen" class="hidden">
  <h2 id="end-title">ALL CORRECT</h2>
  <div id="end-detail"></div>
  <button id="return-btn">RETURN</button>
</div>

  const timerEl = document.getElementById("timer");
  const answerEl = document.getElementById("answer");
  const imageEl = document.getElementById("question-image");
  const startScreen = document.getElementById("start-screen");
  const endScreen = document.getElementById("end-screen");
  const bars = [...document.querySelectorAll(".bar")];
  let current = 0, remaining = 180, interval = null, running = false, locked = false;

  const digitSegments = {"0":"ab cdef".replace(/ /g,""),"1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd","6":"afgecd","7":"abc","8":"abcdefg","9":"abfgcd"};
  function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
  function renderTimer(value){
    timerEl.replaceChildren();
    for(const ch of value){
      if(ch===":"){const colon=document.createElement("span");colon.className="timer-colon";colon.innerHTML="<i></i><i></i>";timerEl.append(colon);continue}
      const digit=document.createElement("span");digit.className="digit";
      for(const seg of "abcdefg"){const el=document.createElement("i");el.className="seg "+seg+(digitSegments[ch].includes(seg)?" on":"");digit.append(el)}
      timerEl.append(digit);
    }
  }
  function updateTimer(){renderTimer(fmt(remaining));document.body.classList.toggle("danger",running&&remaining<=30&&remaining>0)}
  function reset(){
    clearInterval(interval); interval=null; running=false;locked=false;current=0;remaining=180;
    document.body.classList.remove("danger");updateTimer();
    startScreen.classList.remove("hidden");endScreen.classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("count").textContent="1/3";
    bars.forEach((b,i)=>b.classList.toggle("active",i===0));
    answerEl.value="";answerEl.placeholder="_____";answerEl.disabled=false;
    document.getElementById("hint").textContent="";
    showQuestion(0);
  }
  function showQuestion(index){
    current=index;
    document.getElementById("count").textContent=(index+1)+"/3";
    bars.forEach((b,i)=>b.classList.toggle("active",i===index));
    answerEl.value="";answerEl.placeholder="_".repeat(answers[index].length);
    imageEl.src=questionImages[index];
    imageEl.classList.remove("hidden");
  }
  function finish(success){
    clearInterval(interval);interval=null;running=false;locked=true;document.body.classList.remove("danger");
    document.getElementById("app").classList.add("hidden");startScreen.classList.add("hidden");endScreen.classList.remove("hidden");
    document.getElementById("end-title").textContent=success?"ALL CORRECT":"You failed the mission.";
    document.getElementById("end-detail").textContent="";
  }
  function start(){
    startScreen.classList.add("hidden");endScreen.classList.add("hidden");document.getElementById("app").classList.remove("hidden");
    current=0;remaining=180;locked=false;running=true;updateTimer();showQuestion(0);answerEl.focus();
    clearInterval(interval);interval=setInterval(()=>{if(!running)return;remaining--;updateTimer();if(remaining<=0){remaining=0;updateTimer();finish(false)}},1000);
  }
  function submit(){
    if(!running||locked)return;
    const guess=answerEl.value.trim().toLowerCase();
    if(guess===answers[current]){
      if(current===2){finish(true);return}
      current++;showQuestion(current);
      document.getElementById("hint").textContent="";
    }else{
      document.getElementById("hint").textContent="";
      answerEl.select();
    }
  }
  document.getElementById("start-btn").addEventListener("click",start);
  document.getElementById("return-btn").addEventListener("click",reset);
  document.getElementById("submit").addEventListener("click",submit);
  answerEl.addEventListener("keydown",e=>{if(e.key==="Enter")submit()});
  document.getElementById("secret").addEventListener("input",e=>{if(e.target.value.trim().toLowerCase()==="reset"){e.target.value="";reset()}});
  window.addEventListener("resize",()=>{imageEl.style.maxWidth="100%";imageEl.style.maxHeight="100%"});
  reset();
})();
</script>
